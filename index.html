<title>Central Comercial Brase</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Schibsted+Grotesk:wght@400..700&display=swap">
<style>
:root{
  --bg:#f1f2f4;--surface:#ffffff;--surface-2:#f8f9fa;--sunken:#e9ebee;
  --ink:#14161b;--ink-2:#454a54;--muted:#7c818b;--line:#e1e3e7;--line-2:#ccd0d6;
  --accent:#d9480f;--accent-hover:#bf3e0b;--accent-strong:#b23a0a;--accent-soft:#fcebe2;
  --good:#12813a;--good-soft:#e1f2e6;--warn:#9c6300;--warn-soft:#fbefd2;--crit:#c42b2b;--crit-soft:#fbe3e3;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
  --grid:#e6e7ea;--axis:#c3c6cc;--hover:rgba(20,22,27,.05);
  --hero:#16181e;--hero-2:#23262e;
  --shadow-sm:0 1px 2px rgba(18,20,26,.06);
  --shadow:0 1px 2px rgba(18,20,26,.05),0 18px 40px -18px rgba(18,20,26,.28);
  --f-display:"Archivo","Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1014;--surface:#171a20;--surface-2:#1b1f26;--sunken:#20242c;
    --ink:#eef0f3;--ink-2:#b9bec8;--muted:#80868f;--line:#262a32;--line-2:#353a45;
    --accent:#f0621f;--accent-hover:#ff7433;--accent-strong:#ff9a66;--accent-soft:#35190d;
    --good:#3fcb6f;--good-soft:#11291a;--warn:#f0b33a;--warn-soft:#322510;--crit:#ff6b6b;--crit-soft:#361617;
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;
    --grid:#262a31;--axis:#3a3f49;--hover:rgba(255,255,255,.05);
    --hero:#1e222a;--hero-2:#2a2f39;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1014;--surface:#171a20;--surface-2:#1b1f26;--sunken:#20242c;
  --ink:#eef0f3;--ink-2:#b9bec8;--muted:#80868f;--line:#262a32;--line-2:#353a45;
  --accent:#f0621f;--accent-hover:#ff7433;--accent-strong:#ff9a66;--accent-soft:#35190d;
  --good:#3fcb6f;--good-soft:#11291a;--warn:#f0b33a;--warn-soft:#322510;--crit:#ff6b6b;--crit-soft:#361617;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;
  --grid:#262a31;--axis:#3a3f49;--hover:rgba(255,255,255,.05);
  --hero:#1e222a;--hero-2:#2a2f39;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.nav{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:20px 12px 16px;border-right:1px solid var(--line);background:var(--surface);z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 18px/1 var(--f-display);font-stretch:125%;flex:none}
.brand-name{font:800 17px/1 var(--f-display);font-stretch:120%;letter-spacing:-.01em}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin-top:4px;font-weight:600}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left;width:100%}
.nav-item svg{width:18px;height:18px;flex:none}
.nav-item:hover{background:var(--sunken);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.nav-badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.nav-foot{margin-top:auto;display:grid;gap:6px;padding:14px 8px 0;border-top:1px solid var(--line)}
.who-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.off::before{background:var(--warn)}
.sync.wait::before{background:var(--line-2)}
.main{min-width:0;padding-block:24px 72px;padding-inline:28px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 16px 0;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0}
  .brand-sub{display:none}
  .nav-list{order:3;flex-direction:row;overflow-x:auto;width:100%;gap:2px;scrollbar-width:none;padding-bottom:8px}
  .nav-list::-webkit-scrollbar{display:none}
  .nav-item{width:auto;white-space:nowrap;padding:7px 10px}
  .nav-foot{margin:0 0 0 auto;border:0;padding:0;display:flex;align-items:center;gap:8px}
  .nav-foot .who-label,.nav-foot .sync{display:none}
  .nav-foot select{max-width:170px}
  .main{padding-inline:16px;padding-block:16px 56px}
}

/* type + head */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.head h1{font:800 28px/1.05 var(--f-display);font-stretch:114%;letter-spacing:-.02em}
.head p{margin-top:6px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn.danger{color:var(--crit)}
.btn[data-armed]{background:var(--crit);border-color:var(--crit);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:26px;height:26px;border-radius:7px;border:0;background:none;cursor:pointer;display:inline-grid;place-items:center;color:var(--muted);font-size:16px;line-height:1;flex:none}
.icon-btn:hover{background:var(--line);color:var(--ink)}
.icon-btn[data-armed]{background:var(--crit);color:#fff;width:auto;padding:0 8px;font-size:12px;font-weight:700}
.in{height:34px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);min-width:0;width:100%}
textarea.in{height:auto;padding:9px 11px;resize:vertical;line-height:1.55}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.in.auto{width:auto}
.in.search{width:240px;max-width:100%}
.f{display:grid;gap:5px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.ck{width:18px;height:18px;accent-color:var(--good);flex:none;cursor:pointer;margin:0}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.pager{display:inline-flex;align-items:center;gap:4px}
.pager .lbl{min-width:150px;text-align:center;font-weight:700;font-size:13px}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px;flex-wrap:wrap}
.panel-h h2{font:700 15px/1.2 var(--f-display);font-stretch:106%}
.panel-h .sub{font-size:12px;color:var(--muted)}
.panel-b{padding:4px 16px 16px}
.stack{display:grid;gap:14px;align-content:start;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.g-hoje{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1060px){.g2,.g3,.g-hoje{grid-template-columns:minmax(0,1fr)}}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;border:1px dashed var(--line-2);background:var(--surface-2);margin-bottom:14px;font-size:13px;color:var(--ink-2)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.empty{padding:18px 4px;color:var(--muted);font-size:13px}

/* pills, chips, avatars */
.stage{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--c) 16%,transparent);white-space:nowrap;flex:none}
.stage::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.late{background:var(--crit-soft);color:var(--crit)}
.chip.today{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.ex{background:transparent;border:1px dashed var(--line-2);color:var(--muted);height:20px}
.chip.meet{background:color-mix(in srgb,#d49b0b 18%,transparent);color:var(--ink)}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:var(--c,#7c818b);flex:none;letter-spacing:.02em}
.av.none{background:transparent;color:var(--muted);border:1px dashed var(--line-2)}
.av.lg{width:34px;height:34px;font-size:13px}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;cursor:pointer}
.row-main.static{cursor:default}
.row-t{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .row-t{text-decoration:line-through;color:var(--muted)}
.row .time{font:700 13px/1 var(--f-display);font-stretch:105%;font-variant-numeric:tabular-nums;width:44px;flex:none}
.sec-t{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 2px}
.sec-t:first-child{margin-top:4px}
.sec-t .n{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.sec-t.crit{color:var(--crit)}
@media (max-width:600px){.hide-sm{display:none!important}}

/* hoje */
.day-hero{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.day-hero h1{font:800 30px/1.05 var(--f-display);font-stretch:114%;letter-spacing:-.02em}
.day-hero .date{color:var(--muted);margin-top:6px}
.day-stats{display:flex;gap:22px;flex-wrap:wrap}
.day-stat .v{font:800 26px/1 var(--f-display);font-stretch:110%;font-variant-numeric:tabular-nums}
.day-stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.day-stat.crit .v{color:var(--crit)}
.progress{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--good);border-radius:0 4px 4px 0}
.add-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.add-row .in{flex:1 1 160px}
.add-row .in.auto{flex:0 0 auto}
.rt-chips{display:flex;gap:4px;flex-wrap:wrap}
.rt-chip{border:0;padding:0;background:none;cursor:pointer;border-radius:50%}
.rt-chip .av{opacity:.28}
.rt-chip.on .av{opacity:1;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--good)}

/* board */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;align-items:flex-start;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.col{flex:0 0 268px;background:var(--sunken);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 200px);min-height:140px;scroll-snap-align:start;border:1px solid transparent}
.col.side{background:transparent;border:1px dashed var(--line-2)}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:11px 10px 7px 12px;font-weight:700;font-size:13px}
.col-h .dot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.col-h .n{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.col-h .sum{margin-left:auto;font-size:11.5px;color:var(--good);font-weight:700}
.col-h .icon-btn{margin-left:auto}
.col-b{display:flex;flex-direction:column;gap:8px;padding:3px 8px 10px;overflow-y:auto;flex:1}
.col-empty{border:1px dashed var(--line-2);border-radius:9px;padding:14px;text-align:center;color:var(--muted);font-size:12px}
.col-sep{flex:0 0 26px;align-self:stretch;display:flex;align-items:center;justify-content:center}
.col-sep span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:grid;gap:8px;cursor:grab;box-shadow:var(--shadow-sm)}
.card:hover{border-color:var(--line-2)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.35}
.card-t{font-weight:700;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.card-s{color:var(--muted);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.card-s.warn-t{color:var(--warn)}
.card-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-foot{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.card-foot .age{margin-left:auto}
.card-foot .age.stale{color:var(--warn);font-weight:700}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--good)}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drawer-h .stage-dot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.drawer-h select{width:auto;font-weight:700}
.drawer-b{overflow-y:auto;padding:18px 18px 28px;display:grid;gap:22px;align-content:start;flex:1}
.drawer-b h3{font:700 13px/1.2 var(--f-display);font-stretch:106%;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.drawer-b h3 .hint{font-weight:500;font-family:var(--f-body)}
.in.big{font:700 20px/1.2 var(--f-display);font-stretch:108%;height:44px;border-color:transparent;padding-inline:8px;margin-left:-8px;width:calc(100% + 8px)}
.in.big:hover{border-color:var(--line)}
.in.sub{border-color:transparent;padding-inline:8px;margin-left:-8px;width:calc(100% + 8px);color:var(--ink-2)}
.in.sub:hover{border-color:var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.fgrid,.fgrid.three{grid-template-columns:minmax(0,1fr)}}
.touch{display:grid;grid-template-columns:auto 30px minmax(0,1fr) 138px auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.touch:first-child{border-top:0}
.touch .tn{font:800 12px/1 var(--f-display);color:var(--muted)}
.touch .in{height:30px}
.touch.done .in:not([type=date]){text-decoration:line-through;color:var(--muted)}
.touch.late .in[type=date]{border-color:color-mix(in srgb,var(--crit) 60%,transparent);color:var(--crit)}
.touch.today .in[type=date]{border-color:color-mix(in srgb,var(--warn) 60%,transparent);color:var(--warn)}
@media (max-width:520px){.touch{grid-template-columns:auto 24px minmax(0,1fr) auto}.touch .in[type=date]{grid-column:3/4}}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:7px 12px;margin:0;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.sbar{display:flex;gap:2px;height:14px;min-width:150px;border-radius:4px;overflow:hidden;background:var(--sunken)}
.sbar i{display:block;height:100%;min-width:3px}
.hl{display:grid;gap:4px;padding:14px;align-content:start}
.hl .l{font-size:12px;color:var(--muted);font-weight:600}
.hl .n{font:700 15px/1.25 var(--f-display);font-stretch:106%;overflow-wrap:anywhere}
.hl .v{font-size:12.5px;color:var(--ink-2)}
.tbl td.nm{min-width:180px}
.tbl td.nm small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.tbl tr.none td{color:var(--muted)}
.hist{display:grid;gap:6px;font-size:12.5px}
.hist div{display:flex;gap:10px;align-items:center}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums;width:92px;flex:none}
.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(8,10,14,.42);overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);padding:20px;display:grid;gap:14px}
.modal h2{font:800 20px/1.1 var(--f-display);font-stretch:110%}
.modal .foot{display:flex;justify-content:flex-end;gap:8px}

/* commission */
.people{display:flex;gap:6px;flex-wrap:wrap}
.person{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}

.vbars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;align-items:end;height:170px;padding-top:6px}

/* analytics */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:14px}

.hb-track{height:12px;background:var(--sunken);border-radius:0 4px 4px 0;overflow:hidden}

.hb-v{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-2);white-space:nowrap}

.conv{font-size:11.5px;color:var(--muted);padding:0 0 2px 0;margin-left:calc(min(140px,30%) + 10px)}

.feat p{color:var(--ink-2);font-size:13px}

.steps b{color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}

pre.code{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font:12.5px/1.55 ui-monospace,"Cascadia Code",Consolas,monospace;margin:0;color:var(--ink-2)}
.days{display:inline-flex;gap:3px}
.days button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);font-size:11px;font-weight:700;cursor:pointer;color:var(--muted)}

.formula{font:700 15px/1.4 var(--f-display);font-stretch:106%;padding:12px 14px;background:var(--surface-2);border-radius:10px;border:1px solid var(--line)}
.skel{height:120px;border-radius:12px;background:linear-gradient(90deg,var(--sunken),var(--surface-2),var(--sunken));background-size:200% 100%;animation:sh 1.2s infinite}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

<script>
(() => {
/* ---------- constants ---------- */
const STAGES = [
  {id:'novo', name:'Lead Novo', color:'#7c8594', funnel:0},
  {id:'print', name:'Print Enviado', color:'#8a63d2', funnel:1},
  {id:'qualificando', name:'Qualificando', color:'#3a7fe0', funnel:2},
  {id:'agendando', name:'Agendando', color:'#169bb3', funnel:3},
  {id:'marcada', name:'Reunião Marcada', color:'#d49b0b', funnel:4},
  {id:'feita', name:'Reunião Feita', color:'#e8702a', funnel:5},
  {id:'fechado', name:'Fechado', color:'#1f9d55', funnel:6},
  {id:'perdido', name:'Perdido', color:'#d64545', side:true},
  {id:'desqualificado', name:'Desqualificado', color:'#6b7280', side:true},
  {id:'frio', name:'Frio', color:'#5aa6d6', side:true},
  {id:'morno', name:'Morno', color:'#e0668a', side:true},
];
const STAGE = Object.fromEntries(STAGES.map(s => [s.id, s]));
const CLOSED = new Set(['fechado','perdido','desqualificado']);
const ACTIVE = s => !CLOSED.has(s);
const DEFAULT_CONFIG = {
  commission: {base:1000, perMeeting:50, perSale:150},
  cadence: [
    {title:'Primeiro contato', gap:0},
    {title:'Follow-up', gap:2},
    {title:'Prova social / print', gap:2},
    {title:'Última tentativa', gap:2},
  ],
  skipWeekends: true,
  autoAssign: true,
  lossReasons: ['Sem orçamento','Sem resposta','Já tem agência','Não é o momento','Fora do perfil (ICP)','Preço','Outro'],
};
const COLS = ['sellers','leads','tasks','routines','routineLog','docs','adjustments','config','meta','wa_stats'];
const BUCKETS = [
  {id: 'andamento', name: 'Em andamento', color: '#3a7fe0', st: ['novo','print','qualificando','agendando']},
  {id: 'marcada', name: 'Reunião marcada', color: '#d49b0b', st: ['marcada']},
  {id: 'feita', name: 'Reunião feita', color: '#e8702a', st: ['feita']},
  {id: 'venda', name: 'Venda', color: '#1f9d55', st: ['fechado']},
  {id: 'nutricao', name: 'Frio / morno', color: '#8fa3bf', st: ['frio','morno']},
  {id: 'perda', name: 'Perdido / desq.', color: '#d64545', st: ['perdido','desqualificado']},
];
const TR_DIMS = [['ad', 'Criativo'], ['adset', 'Conjunto'], ['campaign', 'Campanha'], ['pain', 'Dor'], ['team', 'Estrutura'], ['revenue', 'Faturamento']];
const TR_MIN = 5;
const SELLER_COLORS = ['#2a78d6','#1f9d55','#8a63d2','#c77700','#d0507a','#128fa6','#5b6472','#b5452a'];
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MON3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WD = ['dom','seg','ter','qua','qui','sex','sáb'];
const WD1 = ['D','S','T','Q','Q','S','S'];
const VIEW_IDS = ['hoje','pipeline','comissao','analises','trafego','processos','whatsapp','config'];

const I = {
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>',
  cols:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>',
  coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M14.6 9.3c-.5-.8-1.5-1.3-2.6-1.3-1.5 0-2.6.8-2.6 2s1.1 1.6 2.6 2 2.6.8 2.6 2-1.1 2-2.6 2c-1.1 0-2.1-.5-2.6-1.3M12 6.5V8M12 16v1.5"/></svg>',
  bars:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 20.5h18M6 17V11M11 17V5M16 17v-8M21 17v-4"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19M9 7h6M9 10.5h4"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.5 11.6a8.4 8.4 0 0 1-12.3 7.5L3.5 20.5l1.4-4.4a8.4 8.4 0 1 1 15.6-4.5z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5" stroke-linecap="round"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l7-7M16.5 3.5 19 5l1.5 2.5"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr = s => esc(s).replace(/\n/g, '&#10;');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const sum = a => a.reduce((x, y) => x + (Number(y) || 0), 0);
const ls = {
  get(k){ try { return localStorage.getItem(k) } catch { return null } },
  set(k, v){ try { localStorage.setItem(k, v) } catch {} },
};
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const iso = () => new Date().toISOString();
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d) };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d) };
const localDay = v => { if (!v) return null; if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v; const d = new Date(v); return isNaN(d) ? null : ymd(d) };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const weekStart = s => { const d = parseYmd(s); return addDays(s, -((d.getDay() + 6) % 7)) };
const fmtDM = s => { const d = parseYmd(s); return pad(d.getDate()) + '/' + pad(d.getMonth()+1) };
const wdOf = s => WD[parseYmd(s).getDay()];
const monthShift = (mk, off) => { const [y,m] = mk.split('-').map(Number); const d = new Date(y, m-1+off, 1); return d.getFullYear() + '-' + pad(d.getMonth()+1) };
const monthLabel = mk => { const [y,m] = mk.split('-').map(Number); return MONTHS[m-1] + ' ' + y };
const brl = n => (n < 0 ? '−' : '') + 'R$ ' + Math.round(Math.abs(n)).toLocaleString('pt-BR');
const pct = (n, d) => d ? (n / d * 100).toFixed(n / d * 100 < 10 && n > 0 ? 1 : 0).replace('.', ',') + '%' : '—';
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const fmtK = n => n >= 1000 ? (n / 1000).toLocaleString('pt-BR', {maximumFractionDigits: 1}) + ' mil' : String(n);
const COL_MAX = 60;
const daysSince = v => v ? Math.max(0, Math.floor((Date.now() - new Date(v)) / 864e5)) : 0;
const fmtHours = h => h == null ? '—' : h < 1 ? Math.max(1, Math.round(h * 60)) + ' min' : h < 24 ? Math.floor(h) + 'h' + pad(Math.round((h % 1) * 60)) : (h / 24).toFixed(1).replace('.', ',') + ' dias';
const waLink = phone => { let d = String(phone || '').replace(/\D/g, ''); if (!d) return ''; if (d.length <= 11) d = '55' + d; return 'https://wa.me/' + d };
const adjWeekend = s => { if (!cfg().skipWeekends) return s; const w = parseYmd(s).getDay(); return w === 6 ? addDays(s, 2) : w === 0 ? addDays(s, 1) : s };
const initials = n => { const p = String(n || '?').trim().split(/\s+/); return ((p[0]||'?')[0] + (p.length > 1 ? p[p.length-1][0] : '')).toUpperCase() };

/* ---------- state ---------- */
const S = { sellers:{}, leads:{}, tasks:{}, routines:{}, routineLog:{}, docs:{}, adjustments:{}, config:{}, meta:{}, wa_stats:{}, ready:{}, dbOk:false, connecting:true };
const UI = {
  view: (() => { const h = (location.hash || '').slice(1); if (VIEW_IDS.includes(h)) return h; const v = ls.get('brase.view'); return VIEW_IDS.includes(v) ? v : 'hoje' })(),
  me: ls.get('brase.me') || '',
  owner: null, search: '', showSide: ls.get('brase.side') !== '0',
  anMode: 'week', anOffset: 0, anOwner: '', anBase: 'cohort',
  trMode: 'all', trOffset: 0, trDim: 'ad',
  dist: {from: 'frio+morno', owner: '*', minRev: '0', qty: 20, to: '', cadence: true, move: 'keep'},
  comSeller: '', comOffset: 0,
  docId: null, docEdit: false, docQ: '',
  cfgTab: 'equipe',
  drawer: null, drawerFocus: null, modal: null,
};
UI.owner = UI.me;
let db = null, MCP = null;
const HOST = window.BRASE_HOST || null;

const cfg = () => { const c = S.config.main || {}; return {...DEFAULT_CONFIG, ...c, commission: {...DEFAULT_CONFIG.commission, ...(c.commission || {})}, waRules: {markTouch: true, moveOnReply: false, ...(c.waRules || {})}, cadence: (c.cadence && c.cadence.length) ? c.cadence : DEFAULT_CONFIG.cadence, lossReasons: c.lossReasons || DEFAULT_CONFIG.lossReasons} };
const arr = col => Object.entries(S[col] || {}).map(([id, d]) => ({id, ...d}));
const leadsArr = () => arr('leads');
const sellersList = () => arr('sellers').sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || '') || a.name.localeCompare(b.name));
const eligible = () => sellersList().filter(s => s.role !== 'Gestor' && s.active !== false);
const sellerColor = id => { const i = sellersList().findIndex(s => s.id === id); return SELLER_COLORS[(i < 0 ? 0 : i) % SELLER_COLORS.length] };
const loaded = () => !S.connecting && (!S.dbOk || COLS.every(c => S.ready[c]));
const validMe = () => (UI.me && S.sellers[UI.me]) ? UI.me : '';

/* ---------- persistence ---------- */
const Q = {};
function onErr(e){
  const code = e && e.code;
  if (code === 'invalid_argument') toast('Seu acesso não permite editar estes dados.', 'err');
  else if (code === 'quota_exceeded') toast('Limite de registros atingido. Apague itens antigos em Configurações › Dados.', 'err');
  else if (code === 'resource_exhausted') toast('Muitas alterações seguidas — aguarde um instante.', 'err');
  else toast('Não foi possível salvar. Tente de novo.', 'err');
  console.warn(e);
}
function q(path, fn){
  const retry = e => (e && e.code === 'unavailable') ? new Promise(r => setTimeout(r, 400 + Math.random() * 700)).then(fn) : Promise.reject(e);
  const p = (Q[path] || Promise.resolve()).then(fn).catch(retry).catch(onErr);
  Q[path] = p; return p;
}
function deepMerge(t, s){ for (const k in s){ if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k])) t[k] = deepMerge(t[k] && typeof t[k] === 'object' ? t[k] : {}, s[k]); else t[k] = s[k] } return t }
function put(col, id, data){
  if (!S.dbOk){ S[col] = {...S[col], [id]: data}; scheduleRender(); return Promise.resolve() }
  return q(col + '/' + id, () => db.doc(col + '/' + id).set(data));
}
function patch(col, id, data){
  if (!S.dbOk){ S[col] = {...S[col], [id]: deepMerge(clone(S[col][id] || {}), data)}; scheduleRender(); return Promise.resolve() }
  return q(col + '/' + id, () => db.doc(col + '/' + id).update(data));
}
function del(col, id){
  if (!S.dbOk){ const m = {...S[col]}; delete m[id]; S[col] = m; scheduleRender(); return Promise.resolve() }
  return q(col + '/' + id, () => db.doc(col + '/' + id).delete());
}
const saveCfg = p => put('config', 'main', {...clone(cfg()), ...p});

/* ---------- domain ---------- */
function buildCadence(start){
  let d = start;
  return cfg().cadence.map((t, i) => {
    d = i === 0 ? adjWeekend(addDays(start, +t.gap || 0)) : adjWeekend(addDays(d, Math.max(1, +t.gap || 1)));
    return {id: uid(), title: t.title || ('Toque ' + (i+1)), due: d, done: false, doneAt: null};
  });
}
function applyMilestones(l, stage, now){
  const st = STAGE[stage]; if (!st || st.side) return;
  const f = st.funnel;
  if (f >= 4 && !l.bookedAt) l.bookedAt = now;
  if (f >= 5 && !l.meetingDoneAt) l.meetingDoneAt = now;
  if (f >= 6 && !l.closedAt) l.closedAt = now;
  if (f < 6) l.closedAt = null;
  if (f < 5) l.meetingDoneAt = null;
  if (f < 4) l.bookedAt = null;
}
function level(l){
  if (l.closedAt) return 6; if (l.meetingDoneAt) return 5; if (l.bookedAt) return 4;
  let m = 0; (l.history || []).concat([{s: l.stage}]).forEach(h => { const st = STAGE[h.s]; if (st && !st.side) m = Math.max(m, Math.min(3, st.funnel)) });
  return m;
}
function pickOwner(extra = {}){
  const el = eligible(); if (!el.length) return '';
  const pool = el.filter(s => s.role === 'SDR'); const list = pool.length ? pool : el;
  const open = id => leadsArr().filter(l => l.ownerId === id && ACTIVE(l.stage)).length + (extra[id] || 0);
  return list.slice().sort((a, b) => open(a.id) - open(b.id))[0].id;
}
function createLead(d){
  const id = uid(), now = iso(), stage = STAGE[d.stage] ? d.stage : 'novo';
  const lead = {
    name: d.name || 'Lead sem nome', company: d.company || '', phone: d.phone || '', email: d.email || '', instagram: d.instagram || '',
    source: d.source || '', notes: d.notes || '', value: d.value ? Number(d.value) || null : null, revenue: d.revenue ? Number(String(d.revenue).replace(/\D/g, '')) || null : null,
    ownerId: d.ownerId || '', stage, createdAt: d.createdAt || now, updatedAt: now, stageAt: now, history: [{s: stage, at: now}],
    touches: buildCadence(today()), bookedAt: null, meetingAt: null, meetingDoneAt: null, closedAt: null, lostReason: '',
    contact: d.contact || '', pain: d.pain || '', team: d.team || '',
  };
  if (d.utm && (d.utm.campaign || d.utm.ad || d.utm.source)) lead.utm = d.utm;
  applyMilestones(lead, stage, now);
  put('leads', id, lead);
  return id;
}
// DDD + 8 últimos dígitos: casa números com e sem o 9 extra (o WhatsApp às vezes omite).
const phoneKey = p => { let d = String(p || '').replace(/\D/g, ''); if (d.length > 11 && d.startsWith('55')) d = d.slice(2); return d.length >= 10 ? d.slice(0, 2) + d.slice(-8) : '' };
function findByPhone(phone){ const k = phoneKey(phone); if (!k) return null; const hit = Object.entries(S.leads).find(([, l]) => phoneKey(l.phone) === k); return hit ? hit[0] : null }
const splitUtm = v => { const s = String(v || '').trim(); const k = s.lastIndexOf('|'); return k > 0 && /^\d{6,}$/.test(s.slice(k + 1)) ? {name: s.slice(0, k).trim(), id: s.slice(k + 1)} : {name: s, id: ''} };
function updateLead(id, p){ const cur = S.leads[id]; if (!cur) return; put('leads', id, {...clone(cur), ...p, updatedAt: iso()}) }
function moveLead(id, stage){
  const cur = S.leads[id]; if (!cur || cur.stage === stage || !STAGE[stage]) return;
  const l = clone(cur), now = iso();
  l.stage = stage; l.stageAt = now; l.updatedAt = now;
  l.history = [...(l.history || []), {s: stage, at: now}].slice(-80);
  applyMilestones(l, stage, now);
  put('leads', id, l);
  const c = cfg().commission, counts = l.ownerId && !l.example;
  let msg = 'Movido para ' + STAGE[stage].name;
  let gain = 0;
  if (counts && l.meetingDoneAt && !cur.meetingDoneAt) gain += c.perMeeting;
  if (counts && l.closedAt && !cur.closedAt) gain += c.perSale;
  if (gain) msg += ` · +${brl(gain)} na comissão de ${S.sellers[l.ownerId]?.name.split(' ')[0] || 'vendedor'}`;
  toast(msg);
  if ((stage === 'perdido' || stage === 'desqualificado') && !l.lostReason) openLead(id, 'loss');
  else if (stage === 'marcada' && !l.meetingAt) openLead(id, 'meeting');
  else render();
}
function nextTouch(l){ return (l.touches || []).filter(t => !t.done).sort((a, b) => a.due.localeCompare(b.due))[0] || null }
function toggleTouch(lid, tid, val){
  const cur = S.leads[lid]; if (!cur) return;
  const l = clone(cur), t = (l.touches || []).find(x => x.id === tid); if (!t) return;
  t.done = val; t.doneAt = val ? iso() : null; l.updatedAt = iso();
  put('leads', lid, l);
  if (val){ const left = l.touches.filter(x => !x.done).length; toast(left ? `Toque feito · faltam ${left}` : 'Cadência concluída — mova o card se não houver resposta') }
}
function commissionFor(sid, mk){
  const c = cfg().commission;
  const L = leadsArr().filter(l => l.ownerId === sid && !l.example);
  const meetingsLeads = L.filter(l => l.meetingDoneAt && (localDay(l.meetingDoneAt) || '').slice(0, 7) === mk);
  const salesLeads = L.filter(l => l.closedAt && (localDay(l.closedAt) || '').slice(0, 7) === mk);
  const adj = arr('adjustments').filter(a => a.sellerId === sid && a.month === mk);
  const adjM = sum(adj.filter(a => a.kind === 'meeting').map(a => a.qty));
  const adjS = sum(adj.filter(a => a.kind === 'sale').map(a => a.qty));
  const bonus = sum(adj.filter(a => a.kind === 'bonus').map(a => a.amount));
  const meetings = meetingsLeads.length + adjM, sales = salesLeads.length + adjS;
  const total = c.base + meetings * c.perMeeting + sales * c.perSale + bonus;
  return {c, base: c.base, meetings, sales, bonus, total, meetingsLeads, salesLeads, adj};
}
function bizDays(mk, upto){
  const [y, m] = mk.split('-').map(Number); const last = new Date(y, m, 0).getDate(); let total = 0, elapsed = 0;
  for (let d = 1; d <= last; d++){ const dt = new Date(y, m-1, d), w = dt.getDay(); if (w === 0 || w === 6) continue; total++; if (upto && ymd(dt) <= upto) elapsed++ }
  return {total, elapsed};
}
function routineDone(rid, sid, day){ return !!(S.routineLog[day.slice(0, 7) + '__' + sid]?.days?.[day]?.[rid]) }
function toggleRoutine(rid, sid){
  const day = today(), id = day.slice(0, 7) + '__' + sid, cur = S.routineLog[id];
  const val = !routineDone(rid, sid, day);
  if (!cur) put('routineLog', id, {sellerId: sid, month: day.slice(0, 7), days: {[day]: {[rid]: val}}});
  else patch('routineLog', id, {days: {[day]: {[rid]: val}}});
}
function todayCount(own){
  const t0 = today(); let n = 0;
  leadsArr().forEach(l => { if (own && l.ownerId !== own) return; if (!ACTIVE(l.stage)) return; (l.touches || []).forEach(t => { if (!t.done && t.due <= t0) n++ }) });
  return n;
}

/* ---------- small UI pieces ---------- */
const stagePill = s => { const st = STAGE[s] || STAGE.novo; return `<span class="stage" style="--c:${st.color}">${st.name}</span>` };
function avatar(id, cls = ''){
  const s = id && S.sellers[id];
  if (!s) return `<span class="av none ${cls}" title="Sem responsável">?</span>`;
  return `<span class="av ${cls}" style="--c:${sellerColor(id)}" title="${attr(s.name)}">${esc(initials(s.name))}</span>`;
}
function ownerOptions(val, allLabel){
  return (allLabel != null ? `<option value="">${esc(allLabel)}</option>` : '') + sellersList().filter(s => s.active !== false || s.id === val).map(s => `<option value="${s.id}" ${s.id === val ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
}
function touchChip(l, t){
  if (!t) return '<span class="chip ok">✓ Cadência concluída</span>';
  const i = (l.touches || []).indexOf(t) + 1, t0 = today();
  if (t.due < t0) return `<span class="chip late">T${i} · atrasado ${daysBetween(t.due, t0)}d</span>`;
  if (t.due === t0) return `<span class="chip today">T${i} · hoje</span>`;
  return `<span class="chip">T${i} · ${wdOf(t.due)} ${fmtDM(t.due)}</span>`;
}
function meetChip(v){ const d = v.slice(0, 10), t0 = today(); return `<span class="chip meet">${I.cal}${d === t0 ? 'hoje' : wdOf(d) + ' ' + fmtDM(d)}${v.length > 10 ? ' · ' + v.slice(11, 16) : ''}</span>` }
function speedChip(created){
  if (!created) return '';
  const min = (Date.now() - new Date(created)) / 6e4; if (!(min >= 0) || min > 72 * 60) return '';
  const txt = min < 60 ? Math.max(1, Math.round(min)) + ' min' : min < 1440 ? Math.floor(min / 60) + 'h' : Math.floor(min / 1440) + 'd';
  return ` <span class="chip ${min > 15 ? 'late' : 'today'}" title="Tempo desde que o lead entrou. Ideal: primeiro contato em até 5 minutos.">entrou há ${txt}</span>`;
}
const head = (title, sub, actions = '') => `<div class="head"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</div>`;
const loading = () => `<div class="stack"><div class="skel" style="height:60px;width:40%"></div><div class="skel"></div><div class="skel" style="height:220px"></div></div>`;
function exampleBanner(){
  const n = leadsArr().filter(l => l.example).length; if (!n) return '';
  return `<div class="banner"><span class="chip ex">Exemplo</span><span style="flex:1;min-width:200px">${n} leads de exemplo estão no quadro para mostrar como tudo funciona. Eles não têm responsável e não contam na comissão.</span><button class="btn sm" data-a="remove-examples" data-confirm="Sim, remover ${n} exemplos">Remover exemplos</button></div>`;
}

/* ---------- views: HOJE ---------- */
function viewHoje(){
  if (!loaded()) return loading();
  const t0 = today(), own = UI.owner && S.sellers[UI.owner] ? UI.owner : '';
  const me = own ? S.sellers[own] : null;
  const leads = leadsArr().filter(l => !own || l.ownerId === own);
  const late = [], due = [], doneT = [];
  leads.forEach(l => { if (!ACTIVE(l.stage)) return; (l.touches || []).forEach((t, i) => { const it = {l, t, i}; if (!t.done){ if (t.due < t0) late.push(it); else if (t.due === t0) due.push(it) } else if (localDay(t.doneAt) === t0) doneT.push(it) }) });
  late.sort((a, b) => a.t.due.localeCompare(b.t.due));
  const waiting = leads.filter(l => l.wa && l.wa.waitingSince && ACTIVE(l.stage)).sort((a, b) => a.wa.waitingSince.localeCompare(b.wa.waitingSince));
  const meetings = leads.filter(l => l.meetingAt && l.meetingAt.slice(0, 10) === t0).sort((a, b) => a.meetingAt.localeCompare(b.meetingAt));
  const tasks = arr('tasks').filter(x => (!own || x.ownerId === own) && ((!x.done && x.due <= t0) || (x.done && localDay(x.doneAt) === t0))).sort((a, b) => (a.done - b.done) || a.due.localeCompare(b.due));
  const wd = new Date().getDay();
  const routines = arr('routines').filter(r => (r.days || []).includes(wd)).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  const team = eligible();
  const rDone = own ? routines.filter(r => routineDone(r.id, own, t0)).length : 0;
  const totalItems = late.length + due.length + doneT.length + tasks.length + (own ? routines.length : 0);
  const doneItems = doneT.length + tasks.filter(x => x.done).length + rDone;
  const h = new Date().getHours(), greet = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  const dateLabel = cap(new Date().toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'}));

  const touchRow = ({l, t, i}, kind) => `<div class="row ${t.done ? 'done' : ''}">
    <input type="checkbox" class="ck" data-c="touch" data-lead="${l.id}" data-touch="${t.id}" ${t.done ? 'checked' : ''} aria-label="Marcar toque como feito">
    <div class="row-main" data-a="open-lead" data-id="${l.id}">
      <div class="row-t">${esc(l.name)}${kind === 'late' ? ` <span class="chip late">atrasado ${daysBetween(t.due, t0)}d</span>` : ''}${i === 0 && !t.done ? speedChip(l.createdAt) : ''}${l.example ? ' <span class="chip ex">Exemplo</span>' : ''}</div>
      <div class="row-s">T${i+1} · ${esc(t.title)}${l.contact ? ' · ' + esc(l.contact) : ''}${l.company ? ' · ' + esc(l.company) : ''}</div>
    </div>
    <span class="hide-sm">${stagePill(l.stage)}</span>
    ${l.phone ? `<a class="btn sm ghost hide-sm" href="${attr(waLink(l.phone))}" target="_blank" rel="noopener" title="Abrir conversa no WhatsApp">WhatsApp</a>` : ''}
    ${own ? '' : avatar(l.ownerId)}
  </div>`;

  const taskRow = x => { const L = x.leadId && S.leads[x.leadId]; return `<div class="row ${x.done ? 'done' : ''}">
    <input type="checkbox" class="ck" data-c="task" data-id="${x.id}" ${x.done ? 'checked' : ''} aria-label="Concluir tarefa">
    <div class="row-main ${L ? '' : 'static'}" ${L ? `data-a="open-lead" data-id="${x.leadId}"` : ''}>
      <div class="row-t">${esc(x.title)}${!x.done && x.due < t0 ? ` <span class="chip late">desde ${fmtDM(x.due)}</span>` : ''}</div>
      ${L ? `<div class="row-s">Lead: ${esc(L.name)}</div>` : ''}
    </div>
    ${own ? '' : avatar(x.ownerId)}
    <button class="icon-btn" data-a="del-task" data-id="${x.id}" data-confirm="Excluir" aria-label="Excluir tarefa">×</button>
  </div>` };

  const routineRow = r => own
    ? `<div class="row ${routineDone(r.id, own, t0) ? 'done' : ''}"><input type="checkbox" class="ck" data-c="routine" data-id="${r.id}" data-seller="${own}" ${routineDone(r.id, own, t0) ? 'checked' : ''} aria-label="Concluir rotina"><span class="time">${esc(r.time || '')}</span><div class="row-main static"><div class="row-t">${esc(r.title)}</div></div></div>`
    : `<div class="row"><span class="time">${esc(r.time || '')}</span><div class="row-main static"><div class="row-t" style="font-weight:500">${esc(r.title)}</div></div><div class="rt-chips">${team.map(s => `<button class="rt-chip ${routineDone(r.id, s.id, t0) ? 'on' : ''}" data-a="routine-chip" data-id="${r.id}" data-seller="${s.id}" title="${attr(s.name)}: ${routineDone(r.id, s.id, t0) ? 'feito' : 'pendente'}">${avatar(s.id)}</button>`).join('')}</div></div>`;

  return `
  <div class="day-hero">
    <div>
      <h1>${greet}${me ? ', ' + esc(me.name.split(' ')[0]) : ''}</h1>
      <p class="date">${dateLabel}</p>
    </div>
    <div class="actions"><select class="in auto" data-c="owner" aria-label="Filtrar por vendedor">${ownerOptions(own, 'Toda a equipe')}</select><button class="btn primary" data-a="new-lead">+ Novo lead</button></div>
  </div>
  <div class="panel" style="padding:16px 18px;margin-bottom:14px;display:grid;gap:14px">
    <div class="day-stats">
      <div class="day-stat ${late.length ? 'crit' : ''}"><div class="v">${late.length}</div><div class="l">toques atrasados</div></div>
      <div class="day-stat"><div class="v">${due.length}</div><div class="l">toques para hoje</div></div>
      <div class="day-stat"><div class="v">${meetings.length}</div><div class="l">reuniões hoje</div></div>
      <div class="day-stat"><div class="v">${tasks.filter(x => !x.done).length}</div><div class="l">tarefas abertas</div></div>
      <div class="day-stat"><div class="v">${doneT.length}</div><div class="l">toques feitos hoje</div></div>
    </div>
    <div style="display:grid;gap:6px"><div class="hint">Dia concluído: <b class="num" style="color:var(--ink)">${pct(doneItems, totalItems)}</b> · ${doneItems} de ${totalItems} itens</div><div class="progress"><i style="width:${totalItems ? doneItems / totalItems * 100 : 0}%"></i></div></div>
  </div>
  ${exampleBanner()}
  <div class="g-hoje">
    <div class="stack">
      ${waiting.length ? `<section class="panel"><div class="panel-h"><h2>Aguardando resposta no WhatsApp</h2><span class="sub">Ideal: responder em até 5 minutos</span></div><div class="panel-b"><div class="rows">${waiting.map(l => `<div class="row"><div class="row-main" data-a="open-lead" data-id="${l.id}"><div class="row-t">${esc(l.name)} <span class="chip ${Date.now() - new Date(l.wa.waitingSince) > 3e5 ? 'late' : 'today'}">há ${minsAgo(l.wa.waitingSince)}</span></div><div class="row-s">${esc(l.wa.lastSnippet || '')}</div></div>${l.phone ? `<a class="btn sm" href="${attr(waLink(l.phone))}" target="_blank" rel="noopener">Responder</a>` : ''}${own ? '' : avatar(l.ownerId)}</div>`).join('')}</div></div></section>` : ''}
      <section class="panel"><div class="panel-h"><h2>Cadência de toques</h2><span class="sub">Marque na hora em que fizer o contato</span></div><div class="panel-b">
        ${late.length ? `<div class="sec-t crit">Atrasados <span class="n">${late.length}</span></div><div class="rows">${late.map(x => touchRow(x, 'late')).join('')}</div>` : ''}
        <div class="sec-t">Para hoje <span class="n">${due.length}</span></div>
        <div class="rows">${due.map(x => touchRow(x, 'today')).join('') || '<div class="empty">Nenhum toque programado para hoje.</div>'}</div>
        ${doneT.length ? `<div class="sec-t">Feitos hoje <span class="n">${doneT.length}</span></div><div class="rows">${doneT.map(x => touchRow(x, 'done')).join('')}</div>` : ''}
      </div></section>
      <section class="panel"><div class="panel-h"><h2>Reuniões de hoje</h2></div><div class="panel-b"><div class="rows">
        ${meetings.map(l => `<div class="row"><span class="time">${esc(l.meetingAt.slice(11, 16) || '—')}</span><div class="row-main" data-a="open-lead" data-id="${l.id}"><div class="row-t">${esc(l.name)}${l.example ? ' <span class="chip ex">Exemplo</span>' : ''}</div><div class="row-s">${esc(l.company || '')}</div></div>${stagePill(l.stage)}${l.stage === 'marcada' ? `<button class="btn sm" data-a="meeting-done" data-id="${l.id}">Reunião feita</button>` : ''}${own ? '' : avatar(l.ownerId)}</div>`).join('') || '<div class="empty">Nenhuma reunião marcada para hoje.</div>'}
      </div></div></section>
    </div>
    <div class="stack">
      <section class="panel"><div class="panel-h"><h2>Tarefas</h2></div><div class="panel-b">
        <div class="rows">${tasks.map(taskRow).join('') || '<div class="empty">Sem tarefas para hoje.</div>'}</div>
        <form class="add-row" data-f="add-task">
          <input class="in" name="title" id="task-title" placeholder="Nova tarefa…" required maxlength="200" aria-label="Nova tarefa">
          <input class="in auto" type="date" name="due" id="task-due" value="${t0}" aria-label="Data">
          <select class="in auto" name="owner" id="task-owner" aria-label="Responsável">${ownerOptions(own || validMe(), 'Sem responsável')}</select>
          <button class="btn primary">Adicionar</button>
        </form>
      </div></section>
      <section class="panel"><div class="panel-h"><h2>Rotina do dia</h2><span class="sub">${own ? `${rDone} de ${routines.length} feitas` : 'Cada círculo é um vendedor · toque para marcar'}</span></div><div class="panel-b">
        <div class="rows">${routines.map(routineRow).join('') || '<div class="empty">Nenhuma rotina para hoje. Cadastre em Configurações › Rotinas.</div>'}</div>
      </div></section>
    </div>
  </div>`;
}

  return items.sort((a, b) => { const x = nextTouch(a), y = nextTouch(b); return (x ? x.due : '9').localeCompare(y ? y.due : '9') || (b.createdAt || '').localeCompare(a.createdAt || '') });

}
function niceTicks(max){

}

function trendChart(buckets){

function md(src){
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out = '', list = null, para = [];
  const flush = () => { if (para.length){ out += '<p>' + inline(para.join(' ')) + '</p>'; para = [] } };
  const close = () => { if (list){ out += `</${list}>`; list = null } };
  const open = t => { if (list !== t){ close(); out += `<${t}>`; list = t } };
  String(src || '').replace(/\r/g, '').split('\n').forEach(raw => {
    const l = raw.trimEnd(); let m;
    if (!l.trim()){ flush(); close(); return }
    if ((m = l.match(/^(#{1,3})\s+(.*)$/))){ flush(); close(); const n = m[1].length + 1; out += `<h${n}>${inline(m[2])}</h${n}>`; return }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(l)){ flush(); close(); out += '<hr>'; return }
    if ((m = l.match(/^>\s?(.*)$/))){ flush(); close(); out += `<blockquote>${inline(m[1])}</blockquote>`; return }
    if ((m = l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))){ flush(); open('ul'); out += `<li class="chk ${m[1].trim() ? 'on' : ''}">${inline(m[2])}</li>`; return }
    if ((m = l.match(/^\s*[-*]\s+(.*)$/))){ flush(); open('ul'); out += `<li>${inline(m[1])}</li>`; return }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ flush(); open('ol'); out += `<li>${inline(m[1])}</li>`; return }
    close(); para.push(l.trim());
  });
  flush(); close(); return out;
}

const CU_STATUS = {'lead novo': 'novo', 'print enviado': 'print', 'primeiro contato': 'print', 'qualificando': 'qualificando', 'em contato': 'qualificando', 'agendando': 'agendando', 'reunião marcada': 'marcada', 'reunião feita': 'feita', 'fechado': 'fechado', 'perdido': 'perdido', 'desqualificado': 'desqualificado', 'frio': 'frio', 'morno': 'morno'};
function parseCSV(text){
  const first = text.slice(0, text.indexOf('\n') + 1 || text.length), delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ f += '"'; i++ } else q = false } else f += ch }
    else if (ch === '"') q = true;
    else if (ch === delim){ row.push(f); f = '' }
    else if (ch === '\n'){ row.push(f); rows.push(row); row = []; f = '' }
    else if (ch !== '\r') f += ch;
  }
  if (f || row.length){ row.push(f); rows.push(row) }
  return rows.filter(r => r.some(x => x.trim()));
}
function parseDesc(txt){
  const lines = String(txt || '').replace(/\r/g, '').replace(/\\_/g, '_').split('\n').map(s => s.trim()).filter(Boolean);
  const utm = [], answers = []; let contact = '';
  lines.forEach((ln, i) => { if (/\|\d{6,}$/.test(ln) || /^(social|link_in_bio|facebook|instagram|ig|fb|paid|organic)$/i.test(ln)) utm.push(ln); else if (i === 0) contact = ln; else answers.push(ln) });
  const out = {contact, pain: answers[0] || '', team: answers[1] || ''};
  const ids = utm.filter(x => /\|\d{6,}$/.test(x)).map(splitUtm);
  if (ids.length) out.utm = {source: 'meta', medium: 'paid', campaign: (ids[0] || {}).name || '', campaignId: (ids[0] || {}).id || '', adset: (ids[1] || {}).name || '', adsetId: (ids[1] || {}).id || '', ad: (ids[2] || {}).name || '', adId: (ids[2] || {}).id || ''};
  else if (utm.some(x => /social|link_in_bio|instagram/i.test(x))) out.utm = {source: 'instagram', medium: 'link_in_bio', campaign: '', campaignId: '', adset: '', adsetId: '', ad: 'Link na bio', adId: ''};
  return out;
}
function parseTaskName(name){

  const phone = parts.find(p => /^\(?\d{2}\)?\s?\d{4,5}-?\d{4}$/.test(p)) || '', rev = parts.find(p => /^\d{4,6}$/.test(p)) || '';
  return {name: parts.filter(p => p !== phone && p !== rev).join(' / '), phone, revenue: rev ? +rev : null};
}

  const iId = col(/^task id$|^id$/), iName = col(/^task name$|^name$/), iContent = col(/task content|^content$|descri/), iStatus = col(/^status$/), iCreated = col(/^date created$/), iAssg = col(/^assignees?$/);

/* ---------- sincronização com o ClickUp (enquanto o time usa os dois) ---------- */
const CU_LIST = '901324302434', CU_DETAIL_MAX = 60, CU_JUNK = /^(teste|sad|eeee|xbxzbvn)$/i;
async function cuCall(tool, input){
  const r = await MCP.callTool('Clickup', tool, input, {cache: false});
  let p = r && r.payload; if (typeof p === 'string'){ try { p = JSON.parse(p) } catch {} }
  if (p && p.error) throw {code: 'tool_error', message: String(p.error)};
  return p || {};
}
function cuMsg(e){
  if (e && /limit/i.test(e.message || '')) return 'O ClickUp atingiu o limite de 100 consultas por dia. O que já foi lido ficou salvo; clique de novo amanhã para continuar.';
  const m = mcpMsg(e); return m.replace(/Pipe \(Meta Ads\)|Pipe/g, 'ClickUp').replace('buscar o investimento', 'ler o ClickUp');
}
function cuSyncInfo(){
  const m = S.meta.clickup, left = leadsArr().filter(l => l.clickupId && !l.utm && !l.cuChecked).length;
  return (m && m.syncedAt ? `Última atualização: ${new Date(m.syncedAt).toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'})}` : 'Ainda não sincronizado') + ` · ${left} leads sem detalhes`;
}
const cuOwner = assignees => { const names = (assignees || []).map(a => String(a.username || '').toLowerCase()); const hit = sellersList().find(s => names.some(n => n.includes(s.name.toLowerCase().split(' ')[0]))); return hit ? hit.id : '' };
async function syncClickup(btn){
  if (!MCP) return;
  if (btn) btn.disabled = true;
  const done = (msg, kind) => { toast(msg, kind); if (btn) btn.disabled = false; render() };
  const byCu = {}; Object.entries(S.leads).forEach(([id, l]) => { if (l.clickupId) byCu[l.clickupId] = id });
  let tasks = [], calls = 0, moved = 0, created = 0, owners = 0, detailed = 0;
  try {
    toast('Lendo a lista CRM do ClickUp…');
    for (let page = 0; page < 20; page++){ const p = await cuCall('clickup_filter_tasks', {list_ids: [CU_LIST], include_closed: true, subtasks: false, page}); calls++; tasks = tasks.concat(p.tasks || []); if (!p.has_more) break }
  } catch (e){ return done(cuMsg(e), 'err') }
  for (const t of tasks){
    const st = CU_STATUS[String(t.status || '').toLowerCase()], id = byCu[t.id], at = new Date(+t.date_updated || Date.now()).toISOString();
    if (id){
      const cur = S.leads[id]; if (!cur) continue; const l = clone(cur); let ch = false;
      if (st && st !== cur.stage){ l.stage = st; l.stageAt = at; l.history = [...(l.history || []), {s: st, at, by: 'clickup'}].slice(-80); applyMilestones(l, st, at); moved++; ch = true }
      const ow = cuOwner(t.assignees); if (ow && ow !== cur.ownerId){ l.ownerId = ow; owners++; ch = true }
      if (ch){ l.updatedAt = iso(); await put('leads', id, l) }
    } else {
      const tn = parseTaskName(t.name); if (!tn.phone || CU_JUNK.test(tn.name) || findByPhone(tn.phone)) continue;
      const stage = st || 'novo', nid = 'c' + String(t.id).replace(/[^A-Za-z0-9_-]/g, '');
      const lead = {name: tn.name || 'Lead sem nome', company: '', contact: '', pain: '', team: '', phone: tn.phone, email: '', instagram: '', notes: '', value: null, revenue: tn.revenue, ownerId: cuOwner(t.assignees), stage, updatedAt: at, stageAt: at, history: [{s: stage, at}], touches: ['novo', 'print', 'qualificando', 'agendando'].includes(stage) ? buildCadence(today()) : [], bookedAt: null, meetingAt: null, meetingDoneAt: null, closedAt: null, lostReason: '', clickupId: t.id, clickupUrl: 'https://app.clickup.com/t/' + t.id, importedAt: iso(), source: 'ClickUp', createdAt: null};
      applyMilestones(lead, stage, at);
      await put('leads', nid, lead); byCu[t.id] = nid; created++;
    }
  }
  // Detalhes (contato, respostas, UTMs, data de entrada) só para quem ainda não tem; mais recentes primeiro.
  const need = tasks.map(t => byCu[t.id]).filter(id => id && S.leads[id] && !S.leads[id].utm && !S.leads[id].cuChecked);
  const byTask = {}; tasks.forEach(t => { byTask[t.id] = t });
  let stopped = '', fetched = 0;
  for (const id of need){
    let p = byTask[S.leads[id].clickupId];
    if (!p || typeof p.markdown_description !== 'string'){
      if (fetched >= CU_DETAIL_MAX) break;
      try { p = await cuCall('clickup_get_task', {task_id: S.leads[id].clickupId}); fetched++ } catch (e){ stopped = cuMsg(e); break }
    }
    const d = parseDesc(p.markdown_description || p.text_content || ''), c = p.date_created ? new Date(+p.date_created) : null;
    const patchData = {cuChecked: true};
    if (d.contact) patchData.contact = d.contact; if (d.pain) patchData.pain = d.pain; if (d.team) patchData.team = d.team;
    if (d.utm){ patchData.utm = d.utm; patchData.source = d.utm.source === 'meta' ? 'Meta Ads' : 'Instagram (link na bio)' }
    if (c && !isNaN(c)) patchData.createdAt = c.toISOString();
    const cur = S.leads[id]; if (cur) await put('leads', id, {...clone(cur), ...patchData}); detailed++;
    if (!MCP.hosted && detailed % 10 === 0) toast(`Lendo detalhes dos leads: ${detailed} de ${Math.min(need.length, CU_DETAIL_MAX)}…`);
  }
  const left = leadsArr().filter(l => l.clickupId && !l.utm && !l.cuChecked).length;
  await put('meta', 'clickup', {syncedAt: iso(), left});
  const msg = `ClickUp: ${moved} mudaram de etapa, ${owners} de responsável, ${created} novos, ${detailed} com detalhes lidos${left ? ` · faltam ${left} para ler` : ''}.`;
  done(stopped ? msg + ' ' + stopped : msg, stopped ? 'err' : undefined);
}

function distCandidates(){

    .sort((a, b) => (+b.revenue || 0) - (+a.revenue || 0) || (b.updatedAt || '').localeCompare(a.updatedAt || ''));
}
async function runDistribution(btn){
  const d = UI.dist; if (!d.to || !S.sellers[d.to]) return;
  const list = distCandidates().slice(0, Math.max(1, Math.min(100, +d.qty || 20)));

    await put('leads', l.id, cur);

  toast(`${list.length} leads passados para ${S.sellers[d.to].name}${d.cadence ? ' com cadência nova' : ''}`);
  render();
}

document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('modal-wrap')){ UI.modal = null; renderModal(); return }

  const stop = e.target.closest('input,select,textarea,label,a[href]');
  if (stop && t.contains(stop) && stop !== t) return;
  if (t.dataset.confirm && !t.dataset.armed){
    const orig = t.innerHTML; t.dataset.armed = '1'; t.textContent = t.dataset.confirm;
    setTimeout(() => { if (t.isConnected && t.dataset.armed){ delete t.dataset.armed; t.innerHTML = orig } }, 3500);
    return;
  }
  const fn = ACT[t.dataset.a]; if (fn){ e.preventDefault(); fn(t, e) }
});

  if (!h){ if (!tip.hidden) tip.hidden = true; return }
  tip.textContent = h.dataset.tip; tip.hidden = false;
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.max(8, e.clientY - tip.offsetHeight - 12);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});

/* ---------- versão hospedada ----------
   Ativa só quando a página define window.BRASE_HOST = {api, functions}. Os documentos ficam na tabela crm_docs
   do Supabase e passam pela função crm-api, que confere o código de acesso da equipe. */
const CODE_KEY = 'brase-crm-code';
function accessScreen(msg){
  return new Promise(resolve => {
    const host = $('#modal-host');
    host.innerHTML = `<div class="modal-wrap" style="background:var(--bg)"><form class="modal" id="login-form" aria-label="Entrar"><div class="brand"><div class="brand-mark">B</div><div><div class="brand-name">Brase</div><div class="brand-sub">Central comercial</div></div></div><h2>Entrar</h2><p class="muted">Digite o código de acesso da equipe.</p><label class="f">Código de acesso<input class="in" type="password" name="code" id="login-code" required autocomplete="current-password"></label><div class="foot"><button class="btn primary">Entrar</button></div><p class="hint" id="login-msg">${esc(msg || '')}</p></form></div>`;
    host.querySelector('#login-code').focus();
    host.querySelector('#login-form').addEventListener('submit', e => {
      e.preventDefault(); const code = String(new FormData(e.target).get('code') || '').trim();
      if (code){ host.querySelector('#login-msg').textContent = 'Entrando…'; resolve(code) }
    });
  });
}
async function hostedDb(conf){
  let code = ''; try { code = localStorage.getItem(CODE_KEY) || '' } catch {}
  const call = async body => {
    const r = await fetch(conf.api, {method: 'POST', headers: {'content-type': 'application/json', 'x-crm-key': code}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) throw {code: 'unauthorized', message: j.error || 'Código inválido.'};
    if (!r.ok) throw {code: j.code || 'unavailable', message: j.error || 'Erro ' + r.status};
    return j;
  };
  let first;
  for (let msg = ''; ; ){
    if (!code) code = await accessScreen(msg);
    try { first = await call({op: 'load'}); break } catch (e){ if (e.code !== 'unauthorized') throw e; code = ''; msg = 'Código inválido. Confira com o gestor.' }
  }
  try { localStorage.setItem(CODE_KEY, code) } catch {}
  $('#modal-host').innerHTML = '';
  const cache = {}, listeners = {}, pending = new Map();
  (first.docs || []).forEach(r => (cache[r.col] ||= new Map()).set(r.id, r.data));
  let cursor = first.cursor;
  const snap = col => ({docs: [...(cache[col] || new Map()).entries()].map(([id, data]) => ({id, exists: true, data: () => data, metadata: {fromCache: false, hasPendingWrites: false}}))});
  const emit = col => (listeners[col] || []).forEach(fn => fn(snap(col)));
  const write = async (col, id, body) => {
    const k = col + '/' + id; pending.set(k, (pending.get(k) || 0) + 1);
    try { await call({...body, col, id}) }
    catch (e){ throw {code: e.code === 'unauthorized' ? 'revoked' : 'unavailable', message: e.message} }
    finally { const n = pending.get(k) - 1; n ? pending.set(k, n) : pending.delete(k) }
  };
  // Mudanças de outras pessoas e dos webhooks: consulta a cada 20 s enquanto a aba está visível.
  const poll = async () => {
    if (document.hidden) return;
    try {
      const j = await call({op: 'changes', since: cursor}), touched = new Set(); cursor = j.cursor;
      for (const r of j.docs || []){
        if (pending.has(r.col + '/' + r.id)) continue;
        const m = (cache[r.col] ||= new Map()); if (r.deleted) m.delete(r.id); else m.set(r.id, r.data); touched.add(r.col);
      }
      touched.forEach(emit);
    } catch (e){ if (e.code === 'unauthorized'){ try { localStorage.removeItem(CODE_KEY) } catch {} toast('O código de acesso mudou. Recarregue a página.', 'err') } }
  };
  setInterval(poll, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll() });
  if (first.clickup) MCP = {hosted: true, callTool: async (server, tool, input) => ({payload: await call({op: 'clickup', tool, input})})};
  return {
    collection(col){ return { onSnapshot(next){
      (listeners[col] ||= []).push(next); setTimeout(() => next(snap(col)));
      return () => { listeners[col] = (listeners[col] || []).filter(f => f !== next) };
    } } },
    doc(path){ const [col, id] = path.split('/'); return {
      async set(data){ (cache[col] ||= new Map()).set(id, data); emit(col); await write(col, id, {op: 'set', data}) },
      async update(patch){ const merged = deepMerge(clone((cache[col] && cache[col].get(id)) || {}), patch); (cache[col] ||= new Map()).set(id, merged); emit(col); await write(col, id, {op: 'set', data: merged}) },
      async delete(){ cache[col] && cache[col].delete(id); emit(col); await write(col, id, {op: 'delete'}) },
    } },
  };
}

/* ---------- boot ---------- */
async function boot(){
  render();
  try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('mcp').then(m => { MCP = m || null; if (MCP) scheduleRender() }, () => {}) } catch {}
  let d = null;
  if (HOST){ try { d = await hostedDb(HOST) } catch (e){ console.warn(e); toast('Não foi possível conectar ao banco. Recarregue a página.', 'err') } }
  else try { if (window.claude && typeof window.claude.use === 'function') d = await window.claude.use('db') } catch { d = null }
  S.connecting = false;
  if (!d){ S.dbOk = false; render(); return }
  db = d; S.dbOk = true;
  COLS.forEach(c => {
    try {
      db.collection(c).onSnapshot(snap => { const m = {}; snap.docs.forEach(x => { m[x.id] = x.data() }); S[c] = m; S.ready[c] = true; scheduleRender() },
        err => { S.ready[c] = true; console.warn(c, err); if (err && err.code === 'revoked') toast('Seu acesso a estes dados mudou. Recarregue a página.', 'err'); scheduleRender() });
    } catch (e) { S.ready[c] = true; console.warn(e) }
  });
  render();
}
boot();
})();
