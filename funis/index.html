<style>
[hidden]{display:none!important}
:root{
  --bg:#f1f2f4;--surface:#ffffff;--surface-2:#f8f9fa;--sunken:#e9ebee;
  --ink:#14161b;--ink-2:#454a54;--muted:#7c818b;--line:#e1e3e7;--line-2:#ccd0d6;
  --accent:#d9480f;--accent-hover:#bf3e0b;--accent-strong:#b23a0a;--accent-soft:#fcebe2;
  --good:#12813a;--good-soft:#e1f2e6;--warn:#9c6300;--warn-soft:#fbefd2;--crit:#c42b2b;--crit-soft:#fbe3e3;
  --sel:#2563eb;--sel-soft:#e6eefc;
  --hover:rgba(20,22,27,.05);
  --shadow-sm:0 1px 2px rgba(18,20,26,.06);
  --shadow:0 1px 2px rgba(18,20,26,.05),0 18px 40px -18px rgba(18,20,26,.28);
  --f-display:"Archivo","Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1014;--surface:#171a20;--surface-2:#1b1f26;--sunken:#20242c;
    --ink:#eef0f3;--ink-2:#b9bec8;--muted:#80868f;--line:#262a32;--line-2:#353a45;
    --accent:#f0621f;--accent-hover:#ff7433;--accent-strong:#ff9a66;--accent-soft:#35190d;
    --good:#3fcb6f;--good-soft:#11291a;--warn:#f0b33a;--warn-soft:#322510;--crit:#ff6b6b;--crit-soft:#361617;
    --sel:#5b8def;--sel-soft:#18233a;
    --hover:rgba(255,255,255,.05);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1014;--surface:#171a20;--surface-2:#1b1f26;--sunken:#20242c;
  --ink:#eef0f3;--ink-2:#b9bec8;--muted:#80868f;--line:#262a32;--line-2:#353a45;
  --accent:#f0621f;--accent-hover:#ff7433;--accent-strong:#ff9a66;--accent-soft:#35190d;
  --good:#3fcb6f;--good-soft:#11291a;--warn:#f0b33a;--warn-soft:#322510;--crit:#ff6b6b;--crit-soft:#361617;
  --sel:#5b8def;--sel-soft:#18233a;
  --hover:rgba(255,255,255,.05);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* controles (os mesmos da Central Comercial) */
.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.btn.danger:hover{background:var(--crit-soft)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn.icon{width:34px;padding:0}.btn.sm.icon{width:28px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.in{height:34px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);min-width:0;width:100%}
textarea.in{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
textarea.code{font:12.5px/1.5 var(--f-mono)}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
select.in{padding-right:26px}
.f{display:grid;gap:5px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.f>.hint{font-weight:400}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.seg.full{display:flex}.seg.full button{flex:1}
.switch{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer;color:var(--ink);font-weight:500}
.switch input{appearance:none;width:32px;height:18px;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--accent)}.switch input:checked::after{transform:translateX(14px)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--crit-soft);color:var(--crit)}.chip.acc{background:var(--accent-soft);color:var(--accent-strong)}
.banner code{font-size:12px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;border:1px dashed var(--line-2);background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.empty{padding:22px 6px;color:var(--muted);font-size:13px;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px;flex-wrap:wrap}
.panel-h h2{font:700 15px/1.2 var(--f-display);font-stretch:106%}
.panel-b{padding:4px 16px 16px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
kbd{font:11px var(--f-mono);background:var(--sunken);border-radius:4px;padding:1px 5px;border:1px solid var(--line)}
pre.code{margin:0;font:12px/1.5 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;white-space:pre-wrap;word-break:break-all}

/* toasts e modais */
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:200;pointer-events:none;width:min(92vw,460px)}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);pointer-events:auto;animation:tin .2s ease}
.toast.err{background:var(--crit);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.modal-wrap{position:fixed;inset:0;background:rgba(10,12,16,.45);display:grid;place-items:center;z-index:150;padding:16px;animation:fin .15s}
@keyframes fin{from{opacity:0}}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:14px;padding:20px}
.modal.wide{width:min(980px,100%)}
.modal h2{font:800 19px/1.2 var(--f-display);font-stretch:110%}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);box-shadow:var(--shadow);z-index:160;overflow:auto;padding:18px;display:grid;gap:14px;align-content:start;animation:din .18s}
@keyframes din{from{transform:translateX(30px);opacity:0}}

/* lista de funis */
.home{max-width:1180px;margin:0 auto;padding:24px 28px 72px}
.home-top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 18px/1 var(--f-display);font-stretch:125%;flex:none}
.brand-name{font:800 17px/1 var(--f-display);font-stretch:120%;letter-spacing:-.01em}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin-top:4px;font-weight:600}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:16px}
.head h1{font:800 28px/1.05 var(--f-display);font-stretch:114%;letter-spacing:-.02em}
.head p{margin-top:6px;color:var(--muted);max-width:720px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;min-width:0}
.fcard .thumb{height:150px;background:var(--sunken);position:relative;overflow:hidden;cursor:pointer;display:grid;place-items:center}
.fcard .thumb .mini{width:300px;height:520px;transform:scale(.56);transform-origin:top center;position:absolute;top:10px;left:50%;margin-left:-150px;border-radius:22px;overflow:hidden;pointer-events:none;box-shadow:var(--shadow)}
.fcard .bd{padding:12px 14px;display:grid;gap:6px;min-width:0}
.fcard .bd h3{font:700 16px/1.2 var(--f-display);font-stretch:106%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .stats{display:flex;gap:14px;font-size:12px;color:var(--muted)}.fcard .stats b{color:var(--ink);font-size:14px;display:block}
.fcard .ft{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}

/* editor */
.ed{display:grid;grid-template-rows:56px minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh}
.ed-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surface);z-index:30}
.ed-title{display:flex;align-items:center;gap:10px;min-width:0}
.ed-title .t{min-width:0}
.ed-title b{display:block;font:700 14px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-title small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px}
.tab{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:600;position:relative}
.tab svg{width:16px;height:16px}
.tab:hover{background:var(--sunken);color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);background:var(--sunken)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-10px;height:3px;border-radius:3px;background:var(--ink)}
.ed-act{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.save-state{font-size:12px;color:var(--muted);white-space:nowrap;margin-right:4px}
.save-state.dirty{color:var(--warn)}.save-state.err{color:var(--crit)}
.ed-main{min-height:0;position:relative}

/* construtor */
.bld{display:grid;grid-template-columns:230px 170px minmax(0,1fr) 350px;height:100%;min-height:0}
.col{min-height:0;overflow:auto;background:var(--surface);border-right:1px solid var(--line)}
.col.props{border-right:0;border-left:1px solid var(--line)}
.steps-list{display:grid;padding:6px 0}
.step-it{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;height:44px;border-left:3px solid transparent;cursor:pointer;color:var(--ink-2);font-size:13.5px;position:relative;user-select:none}
.step-it:hover{background:var(--hover)}
.step-it.on{border-left-color:var(--sel);background:var(--sel-soft);color:var(--ink);font-weight:600}
.step-it .n{font-size:11px;color:var(--muted);width:18px;flex:none;text-align:right}
.step-it .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-it .mn{opacity:0;border:0;background:none;cursor:pointer;color:var(--muted);width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.step-it:hover .mn,.step-it.on .mn{opacity:1}.step-it .mn:hover{background:var(--sunken);color:var(--ink)}
.step-it.drop-before{box-shadow:inset 0 3px 0 var(--sel)}.step-it.drop-after{box-shadow:inset 0 -3px 0 var(--sel)}
.step-it .pub{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.0;flex:none}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;position:sticky;top:0;background:var(--surface);z-index:2}
.pal-g{padding:4px 8px 10px}
.pal-g .eyebrow{display:block;padding:8px 4px 6px;font-size:10.5px}
.pal-it{display:flex;align-items:center;gap:8px;width:100%;height:36px;margin-bottom:5px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:grab;font-size:12.5px;color:var(--ink-2);text-align:left}
.pal-it:hover{border-color:var(--sel);color:var(--ink);background:var(--sel-soft)}
.pal-it svg{width:15px;height:15px;flex:none;color:var(--sel)}
.canvas{position:relative;min-height:0;overflow:auto;display:grid;place-items:center;padding:20px 20px 84px;background-color:var(--bg);background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:18px 18px}
.phone{width:390px;height:min(800px,calc(100vh - 170px));min-height:520px;border-radius:38px;border:10px solid #0b0c0f;background:#fff;box-shadow:var(--shadow);overflow:hidden;position:relative}
.phone .screen{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain}
.phone .screen>div{min-height:100%;display:flex;flex-direction:column}
.phone.desktop{width:min(1100px,100%);border-radius:12px;border-width:6px;height:calc(100vh - 170px)}
.canvas-bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:5}
.canvas-bar .sep{width:1px;background:var(--line);margin:4px 2px}
.props-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.props-h b{flex:1;font:700 14px/1.2 var(--f-display);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);position:sticky;top:53px;background:var(--surface);z-index:3}
.ptabs button{border:0;background:none;padding:7px 9px 9px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.pbody{padding:14px;display:grid;gap:14px}
.psec{display:grid;gap:10px}
.psec+.psec{padding-top:14px;border-top:1px solid var(--line)}
.psec>.eyebrow{margin-bottom:-2px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--surface-2)}
.item-h{display:flex;align-items:center;gap:4px}
.item-h b{flex:1;font-size:12px;color:var(--muted);font-weight:700}
.rich-wrap{border:1px solid var(--line-2);border-radius:8px;background:var(--surface);overflow:hidden}
.rich-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rich-bar{display:flex;flex-wrap:wrap;gap:2px;padding:4px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.rich-bar button{border:0;background:none;min-width:26px;height:26px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:700;color:var(--ink-2);display:grid;place-items:center;padding:0 5px}
.rich-bar button:hover{background:var(--sunken);color:var(--ink)}
.rich-bar .sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.15);padding:0;min-width:0;margin:5px 2px}
.rich{min-height:90px;max-height:420px;overflow:auto;padding:10px;outline:none;font:14px/1.45 Inter,var(--f-body);color:var(--ink)}
.rich.sm{min-height:40px}
.rich h1{font-size:1.5em;margin:0}.rich h2{font-size:1.3em;margin:0}.rich h3{font-size:1.12em;margin:0}.rich p{margin:0}
.rich .ql-align-center{text-align:center}.rich .ql-align-right{text-align:right}
.roles-g{border:1px dashed var(--line-2);border-radius:10px;padding:8px;display:grid;gap:6px}
.roles-or{text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.cond{display:grid;gap:4px}.cond .cr{display:grid;gap:4px;align-items:center;min-width:0}.cond .cr>*{min-width:0}.cond .cr .hint{white-space:nowrap}
.cond .in{height:30px;font-size:12.5px;padding:0 6px}
.vars{display:flex;flex-wrap:wrap;gap:4px}.vars button{border:1px solid var(--line);background:var(--surface);border-radius:6px;font:11.5px var(--f-mono);padding:2px 6px;cursor:pointer;color:var(--ink-2)}.vars button:hover{border-color:var(--sel);color:var(--sel)}

/* fluxo */
.flow{position:absolute;inset:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:20px 20px;cursor:grab;touch-action:none}
.flow.panning{cursor:grabbing}
.flow-world{position:absolute;left:0;top:0;transform-origin:0 0}
.flow svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.flow svg.edges path{fill:none;stroke:var(--muted);stroke-width:1.6}
.flow svg.edges path.next{stroke-dasharray:5 5;opacity:.65}
.flow svg.edges path.hl{stroke:var(--sel);stroke-width:2.4}
.flow svg.edges path.tmp{stroke:var(--sel);stroke-dasharray:4 4}
.node{position:absolute;width:230px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow-sm);font-size:12px;cursor:default;user-select:none}
.node.on{border-color:var(--sel);box-shadow:0 0 0 3px var(--sel-soft)}
.node.drop{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node-h{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:move;font-weight:700;font-size:12.5px}
.node-h .n{color:var(--muted);font-weight:600;font-size:11px}
.node-h .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-b{padding:6px;display:grid;grid-template-columns:minmax(0,1fr);gap:3px}
.node-l{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);position:relative;min-height:24px}
.node-l .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-l.out{background:var(--sel-soft);color:var(--ink)}
.node-l .ext{font-size:10.5px;color:var(--accent-strong);font-weight:700}
.node-l .h{position:absolute;right:-12px;top:50%;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;background:var(--surface);border:2px solid var(--sel);cursor:crosshair}
.node-l .h:hover{background:var(--sel)}
.node .in-h{position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.flow-tools{position:absolute;left:14px;top:14px;display:flex;gap:6px;z-index:5}
.flow-zoom{position:absolute;left:14px;bottom:14px;display:grid;gap:4px;z-index:5}
.flow-tip{position:absolute;right:14px;top:14px;z-index:5;max-width:300px}
.menu{position:fixed;z-index:180;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:200px;max-height:60vh;overflow:auto;display:grid}
.menu button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink);display:flex;gap:8px;align-items:center}
.menu button:hover{background:var(--sunken)}
.menu button.danger{color:var(--crit)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .eyebrow{padding:6px 10px 2px}

/* design */
.dsg{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%;min-height:0}
.dsg .canvas{padding-bottom:20px}
.dsg-steps{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow-sm)}
.dsg-steps select{height:28px;border:0;background:none;font-weight:600;max-width:260px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.preset{border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;background:var(--surface);display:grid;gap:5px;font-size:11.5px;font-weight:600;text-align:center}
.preset:hover{border-color:var(--sel)}
.preset i{display:flex;height:30px;border-radius:5px;overflow:hidden}.preset i span{flex:1}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:13px}
.kv>span{color:var(--ink-2)}
.colorin{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:8px;padding:0 6px;height:34px;background:var(--surface)}
.colorin input[type=color]{width:24px;height:24px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.colorin input[type=text]{border:0;background:none;outline:none;width:100%;font:12.5px var(--f-mono);text-transform:uppercase}
input[type=range]{accent-color:var(--accent);width:100%}

/* leads */
.leads{height:100%;overflow:auto;padding:16px 18px 60px}
.leads-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:grid;gap:5px;align-content:start}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:600}
.kpi .v{font:800 28px/1 var(--f-display);font-stretch:110%;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:calc(100vh - 330px);min-height:240px}
table.tbl{border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 10px;text-align:left;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;background:var(--surface)}
.tbl thead th{position:sticky;top:0;z-index:2;font-weight:600;color:var(--ink-2)}
.tbl thead tr:nth-child(2) th{top:39px;background:var(--surface-2);font-size:12px}
.tbl thead th.stp{font-size:12px}
.tbl thead th.stp .pc{float:right;margin-left:14px;color:var(--ink);font-weight:700}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover td{background:var(--hover)}
.tbl td.sticky,.tbl th.sticky{position:sticky;left:0;z-index:1}
.tbl thead th.sticky{z-index:3}
.tbl .tag{font:11px var(--f-mono);background:var(--sunken);border-radius:4px;padding:1px 5px;margin-right:5px;color:var(--ink-2)}
.tbl .clk{color:var(--sel);font-size:11.5px;border:1px solid color-mix(in srgb,var(--sel) 40%,transparent);border-radius:4px;padding:0 5px}
.tbl .nm{font:11px var(--f-mono);color:var(--muted);margin-left:6px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.bars{display:grid;gap:10px}
.bar-r{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr 70px;gap:10px;align-items:center;font-size:13px;position:relative}
.bar-r .lb{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar-r .tr{height:18px;position:relative}
.bar-r .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bar-r .vl{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.bar-r .vl small{color:var(--muted);margin-left:4px}
.bar-r:hover .tr i{filter:brightness(1.12)}
.vchart{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:180px;padding:8px 0 0;border-bottom:1px solid var(--line);position:relative}
.vchart .c{flex:1;max-width:44px;display:flex;align-items:flex-end;height:100%;position:relative;cursor:default}
.vchart .c i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:1px}
.vchart .c:hover i{filter:brightness(1.15)}
.vaxis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding-top:6px}
.tip{position:fixed;z-index:190;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow)}
.tip b{display:block;font-size:14px}

/* configurações */
.cfg{height:100%;overflow:auto;padding:24px 18px 60px}
.cfg-box{max-width:900px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:560px}
.cfg-nav{border-right:1px solid var(--line);padding:8px;display:grid;align-content:start;gap:2px}
.cfg-nav button{display:flex;align-items:center;gap:9px;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left}
.cfg-nav button svg{width:16px;height:16px}
.cfg-nav button[aria-current="page"]{background:var(--sunken);color:var(--ink);font-weight:600}
.cfg-nav .dot{width:7px;height:7px;border-radius:50%;background:var(--good);margin-left:auto}
.cfg-body{padding:20px 22px;display:grid;gap:16px;align-content:start}
.cfg-body h2{font:800 18px/1.2 var(--f-display);font-stretch:108%}

/* teste (pré-visualização) */
.preview{display:grid;grid-template-columns:auto minmax(0,320px);gap:16px;align-items:start}
.preview .phone{height:min(760px,calc(100vh - 140px))}
.pv-log{display:grid;gap:8px;font-size:12.5px;max-height:calc(100vh - 160px);overflow:auto}
.pv-log .ln{border-bottom:1px solid var(--line);padding-bottom:6px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}

@media (max-width:1180px){.bld{grid-template-columns:200px 150px minmax(0,1fr) 310px}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .ed{height:auto;min-height:100vh;grid-template-rows:auto auto}
  .ed-top{grid-template-columns:1fr;padding:8px 12px;gap:6px}
  .tabs{overflow-x:auto}.ed-act{justify-content:flex-start;flex-wrap:wrap}
  .bld{grid-template-columns:1fr;height:auto}.col{border-right:0;border-bottom:1px solid var(--line);max-height:none}
  .canvas{min-height:600px}.phone{width:100%;max-width:390px}
  .dsg{grid-template-columns:1fr;height:auto}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cfg-box{grid-template-columns:1fr}.cfg-nav{border-right:0;border-bottom:1px solid var(--line);grid-auto-flow:column;overflow-x:auto}
  .preview{grid-template-columns:1fr}
  .home{padding:16px}
  .tbl-wrap{max-height:none}
  .flow{position:relative;height:70vh}
  .ed-main{min-height:70vh}
}
</style>
