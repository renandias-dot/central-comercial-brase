<!doctype html>
<html lang="pt-BR">
<head>
<!-- Domínio da Brase: quem abrir por http:// vai na hora para https:// (o GitHub Pages ainda não força). -->
<script>if(location.protocol==="http:"&&/(^|\.)brasemarketing\.com\.br$/.test(location.hostname))location.replace("https://"+location.host+location.pathname+location.search+location.hash)</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="../">
<!-- Endereço da função funis-api do Supabase. Vazio = modo estático: o funil abre a partir de funis/data/<slug>.json, sem gravar leads. -->
<script>window.FN_HOST = {"api": "https://covwdaygoorabowiuyfr.supabase.co/functions/v1/funis-api"};</script>
<!-- Começa a buscar o funil já aqui, junto com o runtime: a cópia publicada no CDN do Storage, sem esperar o servidor. -->
<script>
(function(){
  try {
    var q = new URLSearchParams(location.search), s = q.get('f') || q.get('funil') || '';
    if (!s) q.forEach(function(v, k){ if (!s && v === '' && /^[a-z0-9][a-z0-9-]*$/i.test(k)) s = k });
    if (!s && location.hash.length > 1) s = decodeURIComponent(location.hash.slice(1));
    if (!s) { var m = /^\/([a-z0-9][a-z0-9-]{0,59})\/?$/i.exec(location.pathname); if (m) s = m[1] }
    s = s.toLowerCase().replace(/[^a-z0-9-]/g, '');
    var api = window.FN_HOST && window.FN_HOST.api;
    if (s && api) window.FN_BOOT = {slug: s, data: fetch(api.replace(/\/functions\/v1\/.*$/, '') + '/storage/v1/object/public/funis/publicados/' + s + '.json')
      .then(function(r){ return r.ok ? r.json() : null }).catch(function(){ return null })};
  } catch (e) {}
})();
</script>
<title>Carregando…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
html,body{margin:0;min-height:100%;background:var(--page-bg,#ffffff)}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#app>div{flex:1;display:flex;flex-direction:column}
#app .fnr{flex:1}
.boot{flex:1;display:grid;place-items:center}
.boot i{width:28px;height:28px;border-radius:50%;border:3px solid rgba(127,127,127,.25);border-top-color:rgba(127,127,127,.8);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{flex:1;display:grid;place-items:center;text-align:center;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#475569;padding:24px}
.msg b{display:block;font-size:18px;color:#0f172a;margin-bottom:4px}
</style>
<script src="runtime.js" defer></script>
</head>
<body>
<div id="app"><div class="boot"><i></i></div></div>
<script>
document.addEventListener('DOMContentLoaded', function(){
'use strict';
const FR = window.FunnelRuntime;
const API = (window.FN_HOST && window.FN_HOST.api) || '';
const qs = new URLSearchParams(location.search);
const params = {}; qs.forEach((v, k) => { params[k] = v });
// ?f=brase-2  ou  ?brase-2  ou  #brase-2
let slug = qs.get('f') || qs.get('funil') || '';
if (!slug) { for (const [k, v] of qs) { if (v === '' && /^[a-z0-9][a-z0-9-]*$/i.test(k)) { slug = k; break } } }
if (!slug && location.hash.length > 1) slug = decodeURIComponent(location.hash.slice(1));
// Endereço limpo do domínio próprio: diagnostico.<domínio>/brase-2 (functions/_middleware.js)
if (!slug) { const m = /^\/([a-z0-9][a-z0-9-]{0,59})\/?$/i.exec(location.pathname); if (m) slug = m[1] }
slug = slug.toLowerCase().replace(/[^a-z0-9-]/g, '');
// Parâmetros que seguem para os links externos e o webhook (como no InLead): todos, menos o endereço do funil neste app.
const urlParams = Object.assign({}, params); delete urlParams.f; delete urlParams.funil; if (urlParams[slug] === '') delete urlParams[slug];
const app = document.getElementById('app');
// Visita só quando a pessoa vê a tela: a Meta às vezes carrega a página escondida antes do clique (pré-carregamento).
// Até ficar visível, a página já fica pronta, mas não registra a visita nem dispara o Pixel. Tocar em algo também conta.
let seen = document.visibilityState !== 'hidden' && !document.prerendering;
const onSeen = [];
const markSeen = () => { if (seen) return; seen = true; onSeen.splice(0).forEach(fn => { try { fn() } catch (e) { console.error(e) } }) };
const whenSeen = fn => { if (seen) fn(); else onSeen.push(fn) };
if (!seen) { const chk = () => { if (document.visibilityState === 'visible' && !document.prerendering) markSeen() }; document.addEventListener('visibilitychange', chk); document.addEventListener('prerenderingchange', chk) }
const show = (title, text) => { app.innerHTML = `<div class="msg"><div><b>${FR.esc(title)}</b>${FR.esc(text || '')}</div></div>` };

async function api(op, body, opt){
  const r = await fetch(API, Object.assign({method: 'POST', headers: {'content-type': 'text/plain;charset=UTF-8'}, body: JSON.stringify(Object.assign({op}, body))}, opt || {}));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ('Erro ' + r.status)); e.status = r.status; throw e }
  return j;
}
// funis-cdn: grava/confere a cópia do funil no CDN (ver supabase/functions/funis-cdn).
const CDN_SYNC = API ? API.replace(/funis-api$/, 'funis-cdn') : '';
const cdnSync = body => { if (CDN_SYNC) fetch(CDN_SYNC, {method: 'POST', headers: {'content-type': 'text/plain;charset=UTF-8'}, body: JSON.stringify(Object.assign({slug}, body)), keepalive: true}).catch(() => {}) };
async function loadFunnel(){
  if (API) {
    const boot = window.FN_BOOT && window.FN_BOOT.slug === slug ? await window.FN_BOOT.data : null;
    if (boot && Array.isArray(boot.steps) && boot.steps.length) return {funnel: boot, live: true, v: boot.published_at || ''};
    try { const j = await api('public.funnel', {slug}); cdnSync({}); return {funnel: j.funnel, live: true} }
    catch (e) { if (e.status === 404) throw e; console.warn('API indisponível, usando o arquivo estático.', e) }
  }
  const r = await fetch(`data/${slug}.json`, {cache: 'no-cache'});
  if (!r.ok) { const e = new Error('não encontrado'); e.status = 404; throw e }
  const j = await r.json();
  return {funnel: j.published || j.draft || j, live: false};
}

/* ---------- scripts e marcação ---------- */
function addScript(src, inline, where){
  const s = document.createElement('script');
  if (src) { s.src = src; s.async = true } else s.textContent = inline;
  (where || document.head).appendChild(s);
}
function addHtml(html, where){
  if (!html) return;
  const box = document.createElement('div'); box.innerHTML = html;
  [...box.childNodes].forEach(n => {
    if (n.nodeName === 'SCRIPT') { const s = document.createElement('script'); for (const a of n.attributes) s.setAttribute(a.name, a.value); s.textContent = n.textContent; where.appendChild(s) }
    else where.appendChild(n);
  });
}
function meta(name, content, prop){
  if (!content) return;
  const m = document.createElement('meta'); m.setAttribute(prop ? 'property' : 'name', name); m.content = content; document.head.appendChild(m);
}
function setup(f){
  const s = f.settings || {}, px = s.pixel || {}, seo = s.seo || {}, d = Object.assign({}, FR.DEFAULT_DESIGN, f.design || {});
  document.title = seo.title || f.title || 'Funil';
  meta('description', seo.description || f.description);
  meta('og:title', seo.title || f.title, true); meta('og:description', seo.description || f.description, true); meta('og:image', seo.image, true);
  if (seo.noindex) meta('robots', 'noindex');
  if (seo.favicon) { const l = document.createElement('link'); l.rel = 'icon'; l.href = seo.favicon; document.head.appendChild(l) }
  if (px.gsv) meta('google-site-verification', px.gsv);
  document.documentElement.style.setProperty('--page-bg', d.backgroundColor || '#fff');
  const fl = document.createElement('link'); fl.rel = 'stylesheet'; fl.href = FR.fontsUrl(d); document.head.appendChild(fl);
  whenSeen(() => tags(px));
  if (s.scripts) { addHtml(s.scripts.head, document.head); addHtml(s.scripts.body, document.body) }
}
// Pixel da Meta, Google Analytics e Tag Manager (só depois que a pessoa vê a tela).
function tags(px){
  if (px.facebook) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    String(px.facebook).split(/[\s,;]+/).filter(Boolean).forEach(id => window.fbq('init', id));
    window.fbq('track', 'PageView');
  }
  if (px.ga4) { addScript('https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(px.ga4)); window.dataLayer = window.dataLayer || []; window.gtag = function(){ dataLayer.push(arguments) }; gtag('js', new Date()); gtag('config', px.ga4) }
  if (px.gtm) { window.dataLayer = window.dataLayer || []; dataLayer.push({'gtm.start': Date.now(), event: 'gtm.js'}); addScript('https://www.googletagmanager.com/gtm.js?id=' + encodeURIComponent(px.gtm)) }
}
// Filtro de tráfego: só deixa entrar quem cumpre as regras.
function blocked(f){
  const r = (f.settings || {}).filter || {};
  if (!r.enabled) return false;
  const ua = navigator.userAgent || '';
  if (r.mobileOnly && !/Android|iPhone|iPad|iPod|Mobile/i.test(ua)) return true;
  if (r.blockBots && /bot|crawler|spider|headless|lighthouse|facebookexternalhit/i.test(ua)) return true;
  const need = String(r.requireParams || '').split(/[\s,;]+/).filter(Boolean);
  if (need.length && !need.some(k => params[k])) return true;
  return false;
}

/* ---------- registro das respostas ---------- */
// Código do visitante: como no InLead, vale 14 dias — quem volta nesse prazo continua o mesmo lead (e o acesso conta uma vez).
const VISITOR_DAYS = 14;
function session(){
  const key = 'fn-visitor:' + slug;
  try { const s = JSON.parse(localStorage.getItem(key) || 'null'); if (s && s.id && Date.now() - s.at < VISITOR_DAYS * 864e5) return s } catch (e) {}
  const s = {id: FR.uid(6), at: Date.now()};
  try { localStorage.setItem(key, JSON.stringify(s)) } catch (e) {}
  return s;
}
const saveSession = sess => { try { localStorage.setItem('fn-visitor:' + slug, JSON.stringify(sess)) } catch (e) {} };
function tracking(){
  const t = {};
  ['utm_source', 'utm_campaign', 'utm_medium', 'utm_content', 'utm_term', 'utm_id', 'fbclid', 'gclid', 'src', 'sck'].forEach(k => { if (params[k]) t[k] = params[k] });
  t.screen = screen.width + 'x' + screen.height; t.viewport = innerWidth + 'x' + innerHeight;
  t.platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  t.userAgent = navigator.userAgent; t.language = (navigator.languages || [navigator.language]).join(',');
  if (document.referrer) t.referrer = document.referrer;
  t.url = location.href.split('#')[0];
  t.params = urlParams;
  // cookies do Pixel da Meta (melhoram a correspondência dos eventos da API de Conversões)
  const ck = n => (document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')) || [])[1];
  if (ck('_fbp')) t.fbp = decodeURIComponent(ck('_fbp'));
  if (ck('_fbc')) t.fbc = decodeURIComponent(ck('_fbc'));
  return t;
}
function tracker(live){
  const sess = session(), queue = []; let sentTracking = !!sess.tracked, timer = 0, inflight = Promise.resolve();
  // Carregada escondida: o que aconteceu até aqui (a abertura da capa) vale a partir de quando a pessoa vê.
  if (!seen) whenSeen(() => { const now = Date.now(); queue.forEach(e => { e.at = now }); flush(true) });
  const payload = () => { const evs = queue.splice(0); const b = {slug, session: sess.id, events: evs}; if (!sentTracking) { b.tracking = tracking(); sentTracking = true; sess.tracked = 1; saveSession(sess) } return b };
  function flush(keepalive){
    clearTimeout(timer);
    if (!live || !seen || !queue.length) return inflight;
    const b = payload();
    inflight = inflight.then(() => api('public.track', b, {keepalive: !!keepalive}).catch(e => console.warn('Falha ao registrar', e)));
    return inflight;
  }
  return {
    code: sess.id,
    push(ev){
      if (!live) return;
      if (ev.type === 'click' || ev.type === 'answer') markSeen();
      queue.push(ev); clearTimeout(timer);
      if (seen) timer = setTimeout(() => flush(true), ev.type === 'click' || ev.type === 'complete' ? 0 : 500);
    },
    flush,
    beacon(){ if (!live || !seen || !queue.length) return; const b = JSON.stringify(Object.assign({op: 'public.track'}, payload())); try { if (!navigator.sendBeacon(API, new Blob([b], {type: 'text/plain'}))) throw 0 } catch (e) { fetch(API, {method: 'POST', body: b, keepalive: true, headers: {'content-type': 'text/plain;charset=UTF-8'}}).catch(() => {}) } },
  };
}

(async () => {
  if (!slug) { show('Funil não encontrado', 'O endereço precisa do nome do funil, por exemplo: …/funis/f/?f=brase-2'); return }
  let got;
  try { got = await loadFunnel() }
  catch (e) { show(e.status === 404 ? 'Funil não encontrado' : 'Não foi possível abrir o funil', e.status === 404 ? 'Confira o endereço ou se o funil foi publicado.' : 'Tente de novo em instantes.'); return }
  const f = got.funnel;
  if (!f || !Array.isArray(f.steps) || !f.steps.length) { show('Funil sem etapas', 'Publique o funil no editor.'); return }
  f.slug = f.slug || slug;
  if (blocked(f)) { const to = f.settings.filter.redirect; if (to) location.replace(to); else show('Página indisponível', ''); return }
  setup(f);
  // ?registro=0: para testar sem virar visita nem lead (não registra nada no servidor).
  const T = tracker(got.live && !!API && new URLSearchParams(location.search).get('registro') !== '0');
  // Teste A/B: a variante do visitante vai nos parâmetros (teste_<nome>), que seguem para o servidor, o webhook e as regras.
  Object.assign(urlParams, FR.abAssign(f, T.code, urlParams));
  // ?step=<id da etapa> (InLead) ou ?etapa=<número ou id>
  const startAt = params.step ? params.step : params.etapa != null ? (/^\d+$/.test(params.etapa) ? Math.max(0, +params.etapa - 1) : params.etapa) : 0;
  // Tag Manager: StepView a cada etapa e FormSubmit ao sair por um link, com os mesmos campos do InLead.
  const layerPush = (ev, url) => {
    const content = {};
    for (const [k, v] of Object.entries(ev.vars || {})) {
      if (k.includes('.')) { const [a, b] = k.split('.'); if (typeof content[a] !== 'object') content[a] = {}; content[a][b] = v }
      else if (k === 'score') { content.score_total = v; if (typeof content.score !== 'object') content.score = {} }
      else content[k] = v;
    }
    const k = f.steps.findIndex(s => s.id === ev.step), st = f.steps[k] || {};
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push(Object.assign({event: url ? 'FormSubmit' : 'StepView'}, url ? {url} : {}, {funnelName: f.title, funnelID: f.id || f.slug, stepName: st.title || '', stepID: ev.step, stepIndex: k + 1, userCode: T.code, params: urlParams, content}));
  };
  // Lead no perfil (Configurações › Leads e dados): avisa o Pixel e o Tag Manager uma vez, com o mesmo event_id do servidor.
  // Com "Só quando…" (Pixel/Scripts), espera também essa condição, ex.: o lead no perfil clicar no botão do formulário.
  const S = f.settings || {}, icpRules = ((S.leads || {}).icp || []).filter(g => Array.isArray(g) && g.length);
  const icpWhen = ((S.pixel || {}).icpWhen || []).filter(g => Array.isArray(g) && g.length);
  let icpSent = false;
  const checkIcp = ev => {
    if (icpSent || !icpRules.length || !ev.vars || !FR.evalRoles(icpRules, {vars: ev.vars})) return;
    if (icpWhen.length && !FR.evalRoles(icpWhen, {vars: ev.vars})) return;
    icpSent = true;
    if ((S.pixel || {}).icpEvent !== false) try { if (window.fbq) window.fbq('trackCustom', 'LeadQualificado', {}, {eventID: T.code + '-icp'}) } catch (e) {}
    window.dataLayer = window.dataLayer || []; window.dataLayer.push({event: 'LeadQualificado', userCode: T.code});
  };
  // Marca o visitante no link do checkout (sck=fn-<código>): a venda avisada pelo checkout volta ligada a este lead.
  const CHECKOUT = /(^|\.)(pay\.kirvano\.com|pay\.hotmart\.com|pay\.kiwify\.com\.br|checkout\.)/i;
  const decorateUrl = url => {
    if (S.checkoutMark === false) return url;
    try { const u = new URL(url); if (CHECKOUT.test(u.hostname) && !u.searchParams.has('sck')) { u.searchParams.set('sck', 'fn-' + T.code); return u.toString() } } catch (e) {}
    return url;
  };
  app.innerHTML = '<div></div>';
  FR.mount(app.firstChild, f, {
    mode: 'live', params: urlParams, step: startAt,
    eventId: k => T.code + '-' + k, decorateUrl,
    onIfood: got.live && API ? (link, km) => api('public.ifood', {slug, link, km}).then(j => j.ifood) : null,
    onEvent: ev => { T.push(Object.assign({}, ev, {vars: undefined})); if (ev.type === 'step') layerPush(ev); else if (ev.type === 'complete' && ev.url) layerPush(ev, ev.url); if (ev.type === 'answer' || ev.type === 'click') checkIcp(ev) },
    beforeRedirect: () => Promise.race([T.flush(true), new Promise(r => setTimeout(r, 1500))]),
  });
  if (got.v !== undefined) setTimeout(() => cdnSync({v: got.v}), 2500);
  addEventListener('pagehide', () => T.beacon());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') T.beacon() });
})();
});
</script>
</body>
</html>
