<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Brase · Restaurantes</title>
<style>
:root{
  --bg:#f1f2f4;--surface:#ffffff;--surface-2:#f8f9fa;--sunken:#e9ebee;
  --ink:#14161b;--ink-2:#454a54;--muted:#7c818b;--line:#e1e3e7;--line-2:#ccd0d6;
  --accent:#d9480f;--accent-hover:#bf3e0b;--accent-soft:#fcebe2;
  --good:#12813a;--crit:#c42b2b;--crit-soft:#fbe3e3;
  --f:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0e1014;--surface:#171a20;--surface-2:#1b1f26;--sunken:#20242c;
    --ink:#eef0f3;--ink-2:#b9bec8;--muted:#80868f;--line:#262a32;--line-2:#353a45;
    --accent:#f0621f;--accent-hover:#ff7433;--accent-soft:#35190d;
    --good:#3fcb6f;--crit:#ff6b6b;--crit-soft:#361617;
  }
}
*{box-sizing:border-box}
body{margin:0;width:340px;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
p{margin:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.brand{font-weight:800;font-size:14px;letter-spacing:-.01em}
.brand small{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
main{padding:14px;display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.name{font-weight:800;font-size:16px;line-height:1.2}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600;background:var(--sunken);color:var(--ink-2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:2px}
.stat .l{font-size:11px;color:var(--muted);font-weight:600}
.stat .v{font-weight:800;font-size:20px;line-height:1.1}
.stat .s{font-size:11px;color:var(--ink-2)}
.up{color:var(--good);font-weight:700;white-space:nowrap}
.down{color:var(--crit);font-weight:700;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;width:100%}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px}
.err{background:var(--crit-soft);color:var(--crit);border-radius:8px;padding:8px 10px;font-size:12.5px}
.in{height:34px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);width:100%}
.in:focus,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
code{font-size:11px;color:var(--muted);word-break:break-all}
</style>
</head>
<body>
<header class="top"><div class="mark">B</div><div class="brand">Brase<small>Restaurantes</small></div></header>
<main id="view" aria-live="polite"><p class="hint">Lendo a aba atual…</p></main>
<script src="popup.js"></script>
</body>
</html>
